<!doctype html>
<html><head><meta charset="utf-8"><title>PS5 Speaker probe 2</title>
<style>body{background:#0d1117;color:#e8eef2;font:22px/1.3 monospace;margin:40px}</style></head>
<body><h1>PS5 Speaker probe 6: Media Source Extensions</h1><pre id="o"></pre>
<script>
// Calls msdk.music the way Spotify's PS5 page does (addSource, load,
// registerNotifyMessage) and reports results to the PC as <img> requests.
var PC = 'http://192.168.1.90:8766/b';
var seq = 0;
function send(text) {
  text = String(text);
  document.getElementById('o').textContent += text.slice(0, 400) + '\n';
  var parts = [], n = 1500;
  for (var i = 0; i < text.length; i += n) parts.push(text.slice(i, i + n));
  var id = ++seq;
  parts.forEach(function (p, i) {
    new Image().src = PC + '?id=' + id + '&i=' + (i + 1) + '&n=' + parts.length + '&d=' + encodeURIComponent(p);
  });
}
function names(obj) {
  var out = [], o = obj, depth = 0;
  while (o && depth < 4) {
    try {
      Object.getOwnPropertyNames(o).forEach(function (k) {
        if (out.indexOf(k) >= 0) return;
        var v; try { v = obj[k]; } catch (e) { v = '[throws]'; }
        var t = typeof v;
        out.push(k + '=' + (t === 'function' ? 'fn(' + v.length + ')' : t === 'object' ? (v === null ? 'null' : 'obj') : t + ':' + String(v).slice(0, 80)));
      });
    } catch (e) {}
    o = Object.getPrototypeOf(o); depth++;
    if (o === Object.prototype) break;
  }
  return out.join(', ');
}
function err(e) { return e && (e.name + ' ' + e.message + ' ' + (e.code || '') + ' ' + JSON.stringify(e)); }
function result(label, p) {
  try {
    if (p && p.then) {
      return p.then(function (v) { send(label + ' OK ' + (typeof v) + ' ' + (v && typeof v === 'object' ? names(v) : String(v))); return v; },
                    function (e) { send(label + ' REJECT ' + err(e)); throw e; });
    }
    send(label + ' SYNC ' + (typeof p) + ' ' + (p && typeof p === 'object' ? names(p) : String(p)));
    return Promise.resolve(p);
  } catch (e) { send(label + ' THROW ' + err(e)); return Promise.reject(e); }
}
window.onerror = function (m, u, l) { send('onerror ' + m + ' line ' + l); };
function src(f) { try { return String(f).slice(0, 2500); } catch (e) { return '[toString throws ' + e + ']'; } }
function call(label, obj, name, args) {
  try { return result(label, obj[name].apply(obj, args || [])).catch(function () {}); }
  catch (e) { send(label + ' THROW ' + err(e)); return Promise.resolve(); }
}
send('page ' + location.search + ' MediaSource=' + typeof window.MediaSource + ' ManagedMediaSource=' + typeof window.ManagedMediaSource +
     ' WebKitMediaSource=' + typeof window.WebKitMediaSource + ' AudioContext=' + typeof window.AudioContext + ' msdk=' + typeof window.msdk);
try {
  var MS = window.MediaSource || window.ManagedMediaSource;
  if (MS) send('isTypeSupported ' + ['audio/mp4; codecs="mp4a.40.2"', 'audio/mpeg', 'audio/webm; codecs="opus"', 'audio/wav', 'audio/aac']
    .map(function (t) { return t + '=' + MS.isTypeSupported(t); }).join(' | '));
} catch (e) { send('isTypeSupported THROW ' + err(e)); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function q(label, s, names) {
  var c = Promise.resolve();
  names.forEach(function (k) { c = c.then(function () { return call(label + '.' + k, s, k); }); });
  return c;
}
var base = location.href.replace(/[^\/]*$/, '').replace(/\?.*$/, '');
var tone = location.href.replace(/[^\/]*(\?.*)?$/, '') + 'tone.wav';
var dir = location.href.replace(/[^\/]*(\?.*)?$/, '');
function mseTest() {
  // Feeds the tone through Media Source Extensions (what MseMusicCore is named after).
  return new Promise(function (done) {
    var ms = new MediaSource();
    var url = URL.createObjectURL(ms);
    send('MSE object url ' + url);
    var m = window.msdk && window.msdk.music;
    if (m) {
      try {
        result('addSource(blob)', m.addSource(url, '', '', function (e) { send('BLOB CB ' + JSON.stringify(e)); }))
          .then(function (s) { window.blobSrc = s; return call('blob.load', s, 'load'); }).catch(function () {});
      } catch (e) { send('addSource(blob) THROW ' + err(e)); }
    }
    document.title = 'Probe Tone - PS5 Speaker';
    var a = document.createElement('audio');
    a.title = 'Probe Tone';
    document.body.appendChild(a);
    ['playing', 'pause', 'error', 'ended', 'waiting'].forEach(function (ev) {
      a.addEventListener(ev, function () { send('MSE-AUDIO ' + ev + (a.error ? ' code ' + a.error.code + ' ' + a.error.message : '') + ' t=' + a.currentTime.toFixed(1)); });
    });
    ms.addEventListener('sourceopen', function () {
      send('MSE sourceopen');
      var sb;
      try { sb = ms.addSourceBuffer('audio/mp4; codecs="mp4a.40.2"'); } catch (e) { send('addSourceBuffer THROW ' + err(e)); done(); return; }
      var x = new XMLHttpRequest();
      x.open('GET', dir + 'tone.mp4'); x.responseType = 'arraybuffer';
      x.onload = function () {
        send('MSE fetched ' + x.response.byteLength + ' bytes');
        sb.addEventListener('updateend', function () {
          try { ms.endOfStream(); } catch (e) {}
          send('MSE appended, buffered ' + (sb.buffered.length ? sb.buffered.end(0).toFixed(1) : 0) + ' s');
          var p = a.play();
          if (p && p.then) p.then(function () { send('MSE play() ok'); }, function (e) { send('MSE play() rejected ' + err(e)); });
          send('MSE holding 18 s: check the Control Center now');
          setTimeout(function () { send('MSE t=' + a.currentTime.toFixed(1)); a.pause(); done(); }, 18000);
        }, { once: true });
        try { sb.appendBuffer(x.response); } catch (e) { send('appendBuffer THROW ' + err(e)); done(); }
      };
      x.onerror = function () { send('MSE fetch failed'); done(); };
      x.send();
    });
    a.src = url;
  });
}
var started = false;
function start() {
  if (started) return; started = true;
  var m = window.msdk && window.msdk.music;
  (m ? call('init', m, 'init') : Promise.resolve()).then(mseTest)
    .then(function () { send('ALL DONE'); }).catch(function (e) { send('chain ' + err(e)); });
}
window.addEventListener('loadedmsdk', start);
setTimeout(start, 4000);
</script></body></html>
