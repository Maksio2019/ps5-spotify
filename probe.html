<!doctype html>
<html><head><meta charset="utf-8"><title>PS5 Speaker probe</title>
<style>body{background:#0d1117;color:#e8eef2;font:24px/1.3 monospace;margin:40px}</style></head>
<body><h1>PS5 Speaker probe</h1><pre id="o"></pre>
<script>
// Lists the system JavaScript bridges this web app gets (window.msdk and others)
// and reports them to the PC as <img> requests (plain-http images are allowed).
var PC = 'http://192.168.1.90:8766/b';
var seq = 0;
function send(text) {
  document.getElementById('o').textContent += text + '\n';
  var parts = [], n = 1500;
  for (var i = 0; i < text.length; i += n) parts.push(text.slice(i, i + n));
  var id = ++seq;
  parts.forEach(function (p, i) {
    new Image().src = PC + '?id=' + id + '&i=' + (i + 1) + '&n=' + parts.length + '&d=' + encodeURIComponent(p);
  });
}
function dump(obj, depth, seen) {
  if (obj === null || obj === undefined) return String(obj);
  var t = typeof obj;
  if (t === 'function') return 'fn(' + obj.length + ')';
  if (t !== 'object') return t + ':' + JSON.stringify(obj);
  if (seen.indexOf(obj) >= 0) return '[cycle]';
  seen.push(obj);
  if (depth <= 0) return '{...}';
  var keys = [];
  for (var k in obj) keys.push(k);
  try { Object.getOwnPropertyNames(obj).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); }); } catch (e) {}
  var out = [];
  keys.forEach(function (k) {
    var v; try { v = obj[k]; } catch (e) { v = '[throws ' + e + ']'; }
    out.push(k + ': ' + dump(v, depth - 1, seen));
  });
  return '{' + out.join(', ') + '}';
}
send('ua ' + navigator.userAgent + ' url ' + location.href);
var std = document.createElement('iframe'); std.style.display = 'none'; document.body.appendChild(std);
function extraGlobals() {
  var base = Object.getOwnPropertyNames(std.contentWindow);
  return Object.getOwnPropertyNames(window).filter(function (k) { return base.indexOf(k) < 0; });
}
send('globals ' + extraGlobals().join(' '));
send('msdk-now ' + (typeof window.msdk) + ' mediaSession ' + (typeof navigator.mediaSession));
window.addEventListener('loadedmsdk', function () {
  send('EVENT loadedmsdk');
  send('msdk ' + dump(window.msdk, 4, []));
});
setTimeout(function () {
  send('after3s globals ' + extraGlobals().join(' '));
  send('after3s msdk ' + dump(window.msdk, 4, []));
}, 3000);
setTimeout(function () { send('after10s msdk ' + typeof window.msdk); }, 10000);
</script></body></html>
